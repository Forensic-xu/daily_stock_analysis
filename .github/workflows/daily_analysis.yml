name: 每日股票分析

on:
  # 定时触发 - UTC 18:00 = 北京时间凌晨02:00 周一到周五(DeepSeek闲时半价)
  schedule:
    - cron: '0 18 * * 1-5'     # UTC 18:00 = 北京时间 02:00

  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析（股票+大盘）
          - market-only   # 仅大盘复盘
          - stocks-only   # 仅股票分析

# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # 添加超时限制，防止任务卡死
    timeout-minutes: 30
    # Job级别env，整个job下shell/python子进程全部继承环境变量，解决变量丢失问题
    env:
      # ==============================
      # AI 配置 DeepSeek OpenAI兼容模式
      # ==============================
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_PROVIDER: openai-compatible
      LLM_MODEL: deepseek-chat
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: https://api.deepseek.com/v1
      OPENAI_MODEL: deepseek-chat

      # Gemini AI (不使用，留空)
      GEMINI_API_KEY: ""
      GEMINI_MODEL: 'gemini-2.5-flash'
      GEMINI_MODEL_FALLBACK: 'gemini-2.0-flash'
      GEMINI_REQUEST_DELAY: '3.0'

      # 搜索服务（不用可以留空）
      BOCHA_API_KEYS: ""
      TAVILY_API_KEYS: ""
      SERPAPI_API_KEYS: ""

      # 通知渠道（全部不用就留空）
      WECHAT_WEBHOOK_URL: ""
      FEISHU_WEBHOOK_URL: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      EMAIL_SENDER: ""
      EMAIL_PASSWORD: ""
      EMAIL_RECEIVERS: ""
      PUSHOVER_USER_KEY: ""
      PUSHOVER_API_TOKEN: ""
      PUSHPLUS_TOKEN: ""
      # ✅ 修复：使用下划线命名，确保 Python os.environ 可读取
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      CUSTOM_WEBHOOK_URLS: ""
      CUSTOM_WEBHOOK_BEARER_TOKEN: ""
      DISCORD_WEBHOOK_URL: ""
      DISCORD_BOT_TOKEN: ""
      DISCORD_MAIN_CHANNEL_ID: ""
      FEISHU_APP_ID: ""
      FEISHU_APP_SECRET: ""
      FEISHU_FOLDER_TOKEN: ""

      # 自选股配置
      STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || '600519' }}

      # 运行配置
      REPORT_TYPE: ${{ vars.REPORT_TYPE || secrets.REPORT_TYPE || 'simple' }}
      SINGLE_STOCK_NOTIFY: ${{ vars.SINGLE_STOCK_NOTIFY || secrets.SINGLE_STOCK_NOTIFY || 'true' }}
      MARKET_REVIEW_ENABLED: ${{ vars.MARKET_REVIEW_ENABLED || secrets.MARKET_REVIEW_ENABLED || 'true' }}
      ANALYSIS_DELAY: ${{ vars.ANALYSIS_DELAY || secrets.ANALYSIS_DELAY || '0' }}

      # 系统配置
      LOG_LEVEL: INFO
      MAX_WORKERS: 3
      ENABLE_CHIP_DISTRIBUTION: 'false'

      # 数据源
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: |
          mkdir -p data logs reports

      # ============================================
      # 🔍 新增：调试环境变量（验证 Python 可读性）
      # ============================================
      - name: 调试环境变量
        run: |
          echo "=========================================="
          echo "🔍 环境变量调试 (SERVERCHAN 相关)"
          echo "=========================================="
          echo ""
          echo "【Shell 环境】"
          echo "  SERVERCHAN_SENDKEY 长度: ${#SERVERCHAN_SENDKEY}"
          if [ -n "$SERVERCHAN_SENDKEY" ]; then
            echo "  SERVERCHAN_SENDKEY 前4位: ${SERVERCHAN_SENDKEY:0:4}..."
            echo "  ✅ Shell 可以读取到 SERVERCHAN_SENDKEY"
          else
            echo "  ❌ Shell 读取不到 SERVERCHAN_SENDKEY"
          fi
          echo ""
          echo "【Python 环境】"
          python3 << 'PYEOF'
          import os
          import sys
          
          print("  Python 版本:", sys.version.split()[0])
          
          # 检查所有环境变量（仅显示匹配的）
          found = False
          for key in os.environ.keys():
              if 'SERVER' in key.upper() and 'CHAN' in key.upper():
                  value = os.environ.get(key, '')
                  if value:
                      print(f"  ✅ os.environ['{key}'] = {value[:4]}... (长度: {len(value)})")
                      found = True
                  else:
                      print(f"  ⚠️ os.environ['{key}'] = (空字符串)")
                      found = True
          
          if not found:
              print("  ❌ 未找到任何 SERVERCHAN 相关的环境变量")
          
          # 尝试几种常见的读取方式
          print("")
          print("  【尝试不同读取方式】")
          test_keys = ['SERVERCHAN_SENDKEY', 'SERVERCHAN-SENDKEY', 'serverchan_sendkey']
          for key in test_keys:
              value = os.environ.get(key)
              if value:
                  print(f"  ✅ os.environ.get('{key}') = {value[:4]}...")
              else:
                  print(f"  ❌ os.environ.get('{key}') = None")
          PYEOF
          echo ""
          echo "=========================================="

      # ============================================
      # 📝 新增：在 Python 执行前导出环境变量（双重保险）
      # ============================================
      - name: 导出环境变量（双重保险）
        run: |
          # 确保关键环境变量被正确导出到 Python 可读取的格式
          # 如果 Python 代码中使用了横杠命名，这里做兼容转换
          export SERVERCHAN_SENDKEY="${SERVERCHAN_SENDKEY}"
          export SERVERCHAN-SENDKEY="${SERVERCHAN_SENDKEY}"  # 兼容旧版横杠命名
          
          # 验证导出
          echo "✅ 环境变量已导出（兼容横杠和下划线两种格式）"
          echo "  SERVERCHAN_SENDKEY (下划线): ${SERVERCHAN_SENDKEY:0:4}..."
          echo "  SERVERCHAN-SENDKEY (横杠): ${SERVERCHAN-SENDKEY:0:4}..."

      - name: 执行股票分析
        run: |
          # 判断运行模式
          MODE="${{ github.event.inputs.mode || 'full' }}"

          echo "=========================================="
          echo "🚀 A股自选股智能分析系统"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🎯 运行模式: $MODE"
          echo "📊 自选股: $STOCK_LIST"
          echo "📝 报告类型: $REPORT_TYPE"
          echo ""
          echo "=========================================="
          echo "📋 配置检查"
          echo "=========================================="
          echo "【AI 配置】"
          echo "  DeepSeek API Key: $([ -n "$DEEPSEEK_API_KEY" ] && echo '✅ 已配置' || echo '❌ 未配置')"
          echo "  LLM_PROVIDER: $LLM_PROVIDER"
          echo "  LLM_MODEL: $LLM_MODEL"
          echo "  Gemini API Key: $([ -n "$GEMINI_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  OpenAI API Key: $([ -n "$OPENAI_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo ""
          echo "【搜索引擎】"
          echo "  Bocha API Keys: $([ -n "$BOCHA_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Tavily API Keys: $([ -n "$TAVILY_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo ""
          echo "【通知渠道】"
          echo "  Server酱‑Turbo: $([ -n "$SERVERCHAN_SENDKEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  PushPlus: $([ -n "$PUSHPLUS_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  企业微信: $([ -n "$WECHAT_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  飞书: $([ -n "$FEISHU_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Telegram: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Discord: $([ -n "$DISCORD_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "=========================================="
          echo ""

          # 执行分析
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review
          else
            python main.py
          fi

      - name: 上传分析报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30

      - name: 显示运行结果
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 分析完成"
          echo "=========================================="
          if [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            echo "生成的报告:"
            ls -la reports/
          else
            echo "⚠️ 未生成报告文件"
          fi
          echo ""
          if [ -f "logs/stock_analysis_$(date +%Y%m%d).log" ]; then
            echo "📜 最近日志（最后 30 行）:"
            tail -30 logs/stock_analysis_*.log 2>/dev/null || echo "无日志"
          fi
