      - name: 执行股票分析
        run: |
          # 把所有环境变量导出到shell环境，让python子进程继承
          export DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          export LLM_PROVIDER="openai-compatible"
          export LLM_MODEL="deepseek-chat"
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          export OPENAI_BASE_URL="https://api.deepseek.com/v1"
          export OPENAI_MODEL="deepseek-chat"

          export GEMINI_API_KEY=""
          export GEMINI_MODEL='gemini-2.5-flash'
          export GEMINI_MODEL_FALLBACK='gemini-2.0-flash'
          export GEMINI_REQUEST_DELAY='3.0'

          export BOCHA_API_KEYS=""
          export TAVILY_API_KEYS=""
          export SERPAPI_API_KEYS=""

          export WECHAT_WEBHOOK_URL=""
          export FEISHU_WEBHOOK_URL=""
          export TELEGRAM_BOT_TOKEN=""
          export TELEGRAM_CHAT_ID=""
          export EMAIL_SENDER=""
          export EMAIL_PASSWORD=""
          export EMAIL_RECEIVERS=""
          export PUSHOVER_USER_KEY=""
          export PUSHOVER_API_TOKEN=""
          export SERVERCHAN_SENDKEY="${{ secrets.SERVERCHAN_SENDKEY }}"
          export CUSTOM_WEBHOOK_URLS=""
          export CUSTOM_WEBHOOK_BEARER_TOKEN=""
          export DISCORD_WEBHOOK_URL=""
          export DISCORD_BOT_TOKEN=""
          export DISCORD_MAIN_CHANNEL_ID=""
          export FEISHU_APP_ID=""
          export FEISHU_APP_SECRET=""
          export FEISHU_FOLDER_TOKEN=""

          export STOCK_LIST="${{ vars.STOCK_LIST || secrets.STOCK_LIST || '600519' }}"
          export REPORT_TYPE="${{ vars.REPORT_TYPE || secrets.REPORT_TYPE || 'simple' }}"
          export SINGLE_STOCK_NOTIFY="${{ vars.SINGLE_STOCK_NOTIFY || secrets.SINGLE_STOCK_NOTIFY || 'true' }}"
          export MARKET_REVIEW_ENABLED="${{ vars.MARKET_REVIEW_ENABLED || secrets.MARKET_REVIEW_ENABLED || 'true' }}"
          export ANALYSIS_DELAY="${{ vars.ANALYSIS_DELAY || secrets.ANALYSIS_DELAY || '0' }}"

          export LOG_LEVEL="INFO"
          export MAX_WORKERS="3"
          export ENABLE_CHIP_DISTRIBUTION="false"
          export TUSHARE_TOKEN="${{ secrets.TUSHARE_TOKEN }}"

          # 判断运行模式
          MODE="${{ github.event.inputs.mode || 'full' }}"

          echo "=========================================="
          echo "🚀 A股自选股智能分析系统"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🎯 运行模式: $MODE"
          echo "📊 自选股: $STOCK_LIST"
          echo "📝 报告类型: $REPORT_TYPE"
          echo ""
          echo "=========================================="
          echo "📋 配置检查"
          echo "=========================================="
          echo "【AI 配置】"
          echo "  DeepSeek API Key: $([ -n "$DEEPSEEK_API_KEY" ] && echo '✅ 已配置' || echo '❌ 未配置')"
          echo "  LLM_PROVIDER: $LLM_PROVIDER"
          echo "  LLM_MODEL: $LLM_MODEL"
          echo "  Gemini API Key: $([ -n "$GEMINI_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  OpenAI API Key: $([ -n "$OPENAI_API_KEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo ""
          echo "【搜索引擎】"
          echo "  Bocha API Keys: $([ -n "$BOCHA_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Tavily API Keys: $([ -n "$TAVILY_API_KEYS" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo ""
          echo "【通知渠道】"
          echo "  Server酱‑Turbo: $([ -n "$SERVERCHAN_SENDKEY" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  PushPlus: $([ -n "$PUSHPLUS_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  企业微信: $([ -n "$WECHAT_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  飞书: $([ -n "$FEISHU_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Telegram: $([ -n "$TELEGRAM_BOT_TOKEN" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "  Discord: $([ -n "$DISCORD_WEBHOOK_URL" ] && echo '✅ 已配置' || echo '⚪ 未配置')"
          echo "=========================================="
          echo ""

          # 执行分析
          if [ "$MODE" = "market-only" ]; then
            python main.py --market-review
          elif [ "$MODE" = "stocks-only" ]; then
            python main.py --no-market-review
          else
            python main.py
          fi
